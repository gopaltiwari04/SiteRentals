<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 110" width="510" height="110" fill="none">
  <defs>
    <linearGradient id="redGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="40%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="navyGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <pattern id="redHazardFull" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#0F172A" stroke-width="4" />
      <line x1="4" y1="0" x2="4" y2="8" stroke="#DC2626" stroke-width="4" />
    </pattern>
    <filter id="redDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Emblem Group -->
  <g transform="translate(6, 5) scale(0.85)">
    <!-- Outer Hexagonal Frame in White & Red -->
    <polygon points="60,6 108,34 108,86 60,114 12,86 12,34" fill="#FFFFFF" stroke="url(#redGradFull)" stroke-width="5" stroke-linejoin="round" />
    <polygon points="60,14 100,38 100,82 60,106 20,82 20,38" fill="url(#navyGradFull)" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3" />

    <!-- Machinery Silhouette -->
    <g filter="url(#redDrop)">
      <path d="M 32 80 L 88 80 L 82 88 L 38 88 Z" fill="url(#redGradFull)" />
      <circle cx="40" cy="74" r="5" fill="#0F172A" stroke="#FFFFFF" stroke-width="2.5" />
      <path d="M 38 72 L 56 34 L 66 38 L 47 75 Z" fill="url(#redGradFull)" />
      <line x1="45" y1="65" x2="58" y2="44" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <circle cx="58" cy="44" r="2.5" fill="#FFFFFF" />
      <path d="M 55 35 L 85 24 L 88 32 L 64 41 Z" fill="#F87171" />
      <path d="M 85 27 L 96 35 L 88 47 L 80 43 L 83 36 Z" fill="url(#redGradFull)" stroke="#FFFFFF" stroke-width="1" />
      <polygon points="96,35 99,39 96,41 94,38" fill="#FFFFFF" />
      <polygon points="93,42 96,46 93,47 91,44" fill="#FFFFFF" />
      <polygon points="89,47 92,51 88,52 87,48" fill="#FFFFFF" />
    </g>
    <rect x="42" y="94" width="36" height="5" fill="url(#redHazardFull)" rx="1" />
  </g>

  <!-- Typography: SITE RENTALS -->
  <text x="116" y="65" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#0F172A" letter-spacing="1.5">SITE</text>
  <text x="232" y="65" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="url(#redGradFull)" letter-spacing="2">RENTALS</text>
  
  <!-- Red & Slate Underline Accent -->
  <path d="M 116 78 L 465 78" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 232 78 L 440 78" stroke="url(#redGradFull)" stroke-width="3.5" stroke-linecap="round" />
  <polygon points="445,75 453,78 445,81" fill="#DC2626" />

  <!-- Tagline: HEAVY EQUIPMENT MARKETPLACE • PAN INDIA -->
  <text x="118" y="95" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="4">HEAVY EQUIPMENT MARKETPLACE • PAN INDIA</text>
</svg>