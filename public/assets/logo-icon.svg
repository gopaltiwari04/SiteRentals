<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="whiteSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="redHazard" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#0F172A" stroke-width="5" />
      <line x1="5" y1="0" x2="5" y2="10" stroke="#DC2626" stroke-width="5" />
    </pattern>
  </defs>

  <!-- Outer Hexagonal Heavy-Duty Frame in Red & Navy -->
  <polygon points="60,6 108,34 108,86 60,114 12,86 12,34" fill="#FFFFFF" stroke="url(#redGrad)" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Subtle Inner Inset Border in Navy -->
  <polygon points="60,14 100,38 100,82 60,106 20,82 20,38" fill="url(#navyGrad)" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- Excavator Boom & Hydraulic Arm Silhouette in Vibrant Red & White -->
  <g filter="url(#redGlow)">
    <!-- Base Turret / Track Plate -->
    <path d="M 32 80 L 88 80 L 82 88 L 38 88 Z" fill="url(#redGrad)" />
    <!-- Hydraulic Boom Main Pivot -->
    <circle cx="40" cy="74" r="5" fill="#0F172A" stroke="#FFFFFF" stroke-width="2.5" />
    
    <!-- Primary Heavy Boom Arm in Bright Red -->
    <path d="M 38 72 L 56 34 L 66 38 L 47 75 Z" fill="url(#redGrad)" />
    <!-- Hydraulic Cylinder Accent in White Silver -->
    <line x1="45" y1="65" x2="58" y2="44" stroke="url(#whiteSilver)" stroke-width="3" stroke-linecap="round" />
    <circle cx="58" cy="44" r="2.5" fill="#FFFFFF" />

    <!-- Forearm / Stick Section reaching up and forward -->
    <path d="M 55 35 L 85 24 L 88 32 L 64 41 Z" fill="#F87171" />
    
    <!-- Heavy-Duty Excavator Bucket / Crane Hook -->
    <path d="M 85 27 L 96 35 L 88 47 L 80 43 L 83 36 Z" fill="url(#redGrad)" stroke="#FFFFFF" stroke-width="1" />
    <!-- Bucket Teeth in Pure White -->
    <polygon points="96,35 99,39 96,41 94,38" fill="#FFFFFF" />
    <polygon points="93,42 96,46 93,47 91,44" fill="#FFFFFF" />
    <polygon points="89,47 92,51 88,52 87,48" fill="#FFFFFF" />

    <!-- Lifting Cable / Dynamic Power Spark -->
    <path d="M 88 47 Q 82 58 74 65" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-dasharray="2,2" />
  </g>

  <!-- Industrial Hazard Strip Bottom Accent in Red & Navy -->
  <rect x="42" y="94" width="36" height="5" fill="url(#redHazard)" rx="1" stroke="#DC2626" stroke-width="0.5" />
</svg>